name: Frontend Development

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Expo
        run: npx expo export --platform web

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.RASPBERRY_HOST }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.RASPBERRY_SSH_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.RASPBERRY_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Prepare frontend package
        run: |
          tar \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.expo' \
            --exclude='./dist' \
            -czf /tmp/frontend.tar.gz .

      - name: Deploy frontend
        run: |
          scp /tmp/frontend.tar.gz \
            "${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}:/tmp/frontend.tar.gz"

          ssh "${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}" \
            "rm -rf /opt/calculaconta/frontend/* && \
            tar -xzf /tmp/frontend.tar.gz -C /opt/calculaconta/frontend && \
            rm /tmp/frontend.tar.gz"

      - name: Install Raspberry dependencies
        run: |
          ssh "${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}" \
            "source /home/deploy/.nvm/nvm.sh && \
            cd /opt/calculaconta/frontend && \
            npm ci"

      - name: Restart Expo Metro
        run: |
          ssh "${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}" \
            "sudo -n systemctl restart calculaconta-frontend"

      - name: Check Metro
        run: |
          ssh "${{ secrets.RASPBERRY_USER }}@${{ secrets.RASPBERRY_HOST }}" \
            "sudo systemctl is-active --quiet calculaconta-frontend"